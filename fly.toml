# fly.toml app configuration file generated for auditoria-estoque-cfobras on 2026-11-25T13:44:38-03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'auditoria-estoque-cfobras'
primary_region = 'gru'

[build]
[[mounts]]
  source = 'evidencias'
  destination = '/app/evidencias'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
