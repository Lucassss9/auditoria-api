spring:
  application:
    name: auditoria-api
  servlet:
    session:
      timeout: 12h
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB}
    username: postgres
    password: ${POSTGRES_PASSWORD}
cf:
  url: ${CF_URL}
evidencias:
  pasta: ${EVIDENCIAS_PASTA:evidencias}
